services:
  - type: web
    name: intelliplanner-google-auth
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        value: 1061518124608-cvv5gk26kq5hps6677h66dt0u7ndbt4q.apps.googleusercontent.com
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGINS
        value: https://intelliplanner.github.io
      - key: FIREBASE_PROJECT_ID
        value: javatutorial-1c117
      - key: FIREBASE_WEB_API_KEY
        value: "AIzaSyCiIZUqOyisT6YyyZUg5fUPc0i6WmoKKjw"
      - key: FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_BOOTSTRAP_ENABLED
        sync: false
      - key: PASSWORD_UNIQUENESS_SECRET
        generateValue: true
