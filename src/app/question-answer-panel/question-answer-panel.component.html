<div class="admin-panel">
  <h2>Interview Q&A Admin Panel</h2>

  <!-- Global Notification -->
  <div *ngIf="notification" [ngClass]="notificationType" class="notification">
    {{ notification }}
  </div>

  <!-- Common Category Section -->
  <div class="category-section">
    <label>Category (shared):</label>
    <select [(ngModel)]="selectedCategory" required>
      <option value="">Select Category</option>
      <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
    </select>
    <input *ngIf="selectedCategory === 'Other'" [(ngModel)]="newCategory" placeholder="Enter new category" required />
  </div>

  <!-- Multiple Questions -->
  <div *ngFor="let q of newQuestions; let i = index" class="qa-block">
    <button *ngIf="i > 0" class="remove-btn" (click)="removeQuestion(i)">✖</button>

    <!-- SubCategory -->
    <label>SubCategory:</label>
    <select [(ngModel)]="q.subCategory" required>
      <option value="">Select SubCategory</option>
      <option *ngFor="let s of subCategories" [value]="s">{{ s }}</option>
    </select>
    <input *ngIf="q.subCategory === 'Other'" [(ngModel)]="q.newSubCategory" placeholder="Enter new subcategory"
      required />

    <!-- Question Text -->
    <label>Question:</label>
    <input [(ngModel)]="q.question" required />

    <div class="answers-section">
      <h4>Answers</h4>

      <div class="answer-buttons">
        <button (click)="addTextAnswer(q)">➕ Add Text Answer</button>
        <button (click)="addTableAnswer(q)">➕ Add Table Answer</button>
      </div>


      <div *ngFor="let ans of q.answer; let j = index" class="answer-block">
        <div class="answer-header">
          <label>Answer Type: {{ ans.answerType }}</label>
          <button class="remove-btn" (click)="removeAnswer(q, j)">✖ Remove</button>
        </div>

        <!-- Text Answer -->
        <textarea *ngIf="ans.answerType === 'text'" [(ngModel)]="ans.answerValue"></textarea>

        <!-- Table Answer -->
        <div *ngIf="ans.answerType === 'table'">
          <table>
            <tr *ngFor="let row of ans.answerValue; let r = index">
              <ng-container *ngIf="r === 0; else bodyRow">
                <th *ngFor="let cell of row; let c = index">
                  <input [(ngModel)]="ans.answerValue[r][c]" placeholder="Header {{c+1}}" />
                </th>
              </ng-container>
              <ng-template #bodyRow>
                <td *ngFor="let cell of row; let c = index">
                  <input [(ngModel)]="ans.answerValue[r][c]" />
                </td>
              </ng-template>
            </tr>
          </table>
          <div class="table-buttons">
            <button (click)="addRow(ans)">Add Row</button>
            <button (click)="addColumn(ans)">Add Column</button>
            <button (click)="deleteRow(ans)">Delete Row</button>
            <button (click)="deleteColumn(ans)">Delete Column</button>
          </div>
        </div>
      </div>

    </div>


  </div>

  <button (click)="addNewQuestion()">➕ Add Another Question</button>
  <button (click)="saveQuestions()">💾 Save All</button>
</div>
