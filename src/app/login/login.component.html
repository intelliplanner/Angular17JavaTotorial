<section class="vh-100">
    <div class="container-fluid h-custom">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-md-9 col-lg-6 col-xl-5">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp" class="img-fluid" alt="Sample image">
            </div>
            <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
                <form (submit)="$event.preventDefault()">
                    <br>

                    <!-- Email input -->
                    <div data-mdb-input-init class="form-outline mb-4">
                        <input type="text" id="name" class="form-control form-control-lg" #txtName placeholder="Enter Username" />
                        <label class="form-label" for="form3Example3">Username:admin</label>
                    </div>

                    <!-- Password input -->
                    <div data-mdb-input-init class="form-outline mb-3">
                        <input type="password" id="pwd" class="form-control form-control-lg" #txtPassword  placeholder="Enter password" />
                        <label class="form-label" for="form3Example4">Password:admin</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <!-- Checkbox -->
                        <div class="form-check mb-0">
                            <input class="form-check-input me-2" type="checkbox" value="" id="form2Example3" />
                            <label class="form-check-label" for="form2Example3">
                                Remember me
                            </label>
                        </div>
                        <a href="#!" class="text-body">Forgot password?</a>
                    </div>

                    <div class="text-center text-lg-start mt-4 pt-2">
                        <button type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg" style="padding-left: 2.5rem; padding-right: 2.5rem;"
                            (click)="login(txtName.value,txtPassword.value)">Login</button>
                        
                        <p class="small fw-bold mt-2 pt-1 mb-0">Don't have an account?
                            <a href="#!" class="link-danger">Register</a>
                        </p>
                    </div>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-2">Or</p>
                        <div #googleButton class="google-sign-in-button"></div>
                        <p *ngIf="isGoogleSubmitting" class="text-muted mt-2" role="status">Signing in with Google...</p>
                        <p *ngIf="errorMessage" class="text-danger mt-2" role="alert">{{ errorMessage }}</p>
                    </div>

                </form>
            </div>
        </div>
    </div>

</section>
