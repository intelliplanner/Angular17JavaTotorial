<main class="player-shell" *ngIf="session && question">
  <header class="player-header">
    <a routerLink="/quiz" class="brand-mark">Q<span>uizLab</span></a>
    <div class="session-label">{{ session.category }} <span>·</span> {{ session.subCategory || 'All subcategories' }} <span>·</span> {{ session.difficulty }}</div>
    <div class="timer-pill" [class.timer-warning]="session.remainingSeconds <= 300" role="timer">
      <span aria-hidden="true">◷</span> {{ timer.format(session.remainingSeconds) }}
      <span class="visually-hidden">remaining</span>
    </div>
  </header>
  <div class="progress-track"><div class="progress-fill" [style.width.%]="progress"></div></div>
  <div *ngIf="saveError" class="alert alert-danger" role="alert">{{ saveError }}</div>
