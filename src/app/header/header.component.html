<nav class="navbar hub-navbar navbar-expand-lg">
  <div class="navbar-inner">
    <a class="navbar-brand hub-brand" routerLink="/home" (click)="closeMenu()" aria-label="Tech Interview Hub home">
      <span class="hub-brand-icon"><i class="fa-solid fa-terminal"></i></span>
      <span>Tech Interview<strong>Hub</strong></span>
    </a>
    <button class="navbar-toggler hub-toggler" type="button" aria-controls="hubNav" [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation" (click)="isMenuOpen = !isMenuOpen">
      <i class="fa-solid" [ngClass]="isMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
    </button>

    <div class="collapse navbar-collapse hub-nav-collapse" [class.show]="isMenuOpen" id="hubNav">
      <div class="navbar-nav hub-nav-links" [hidden]="!isLoggedIn">
        <a class="nav-link" routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Home</a>
        <a class="nav-link" routerLink="/categorizedNotes" routerLinkActive="active" (click)="closeMenu()">Learn</a>
        <!-- <a class="nav-link" routerLink="/interview" routerLinkActive="active" (click)="closeMenu()">Interview prep</a> -->
        <a class="nav-link" routerLink="/quiz" routerLinkActive="active" (click)="closeMenu()">Practice quiz</a>
        <a *ngIf="isAdmin" class="nav-link" routerLink="/quiz/questions" routerLinkActive="active" (click)="closeMenu()">Question manager</a>
        <a *ngIf="isAdmin" class="nav-link" routerLink="/quiz/categories" routerLinkActive="active" (click)="closeMenu()">Categories</a>
      </div>
      <div class="hub-nav-actions">
        <button *ngIf="isLoggedIn" type="button" class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
          <i class="fa-solid" [ngClass]="darkMode ? 'fa-sun' : 'fa-moon'"></i>
        </button>
        <a *ngIf="!isLoggedIn" routerLink="/login" class="btn hub-signin" (click)="closeMenu()">Sign in</a>
        <button *ngIf="isLoggedIn" type="button" class="btn hub-signin" (click)="logout(); closeMenu()">Sign out</button>
      </div>
    </div>
  </div>
</nav>
