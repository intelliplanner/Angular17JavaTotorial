<nav class="navbar hub-navbar navbar-expand-lg">
  <div class="navbar-inner">
    <a class="navbar-brand hub-brand" routerLink="/home" (click)="closeMenu()" aria-label="Tech Interview Hub home">
      <span class="hub-brand-icon"><i class="fa-solid fa-terminal"></i></span>
      <span>Tech Interview<strong>Hub</strong></span>
    </a>
    <button class="navbar-toggler hub-toggler" type="button" aria-controls="hubNav" [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation" (click)="isMenuOpen = !isMenuOpen">
      <i class="fa-solid" [ngClass]="isMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
    </button>

    <div class="collapse navbar-collapse hub-nav-collapse" [class.show]="isMenuOpen" id="hubNav">
      <div class="navbar-nav hub-nav-links" [hidden]="loginEnabled && !isLoggedIn">
        <a class="nav-link" routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Home</a>
        <a class="nav-link" routerLink="/tutorials" routerLinkActive="active" (click)="closeMenu()">Tutorials</a>
        <a class="nav-link" routerLink="/learn" routerLinkActive="active" (click)="closeMenu()">Video learning</a>
        <a class="nav-link" routerLink="/categorizedNotes" routerLinkActive="active" (click)="closeMenu()">Interview
          Notes</a>
        <a class="nav-link" routerLink="/quiz" routerLinkActive="active" (click)="closeMenu()">Practice quiz</a>
        <div *ngIf="settingsEnabled && isAdmin" class="settings-menu" [class.open]="isSettingsOpen">
          <button type="button" class="nav-link settings-toggle" (click)="toggleSettings()"
            [attr.aria-expanded]="isSettingsOpen" aria-controls="adminSettings">
            <i class="fa-solid fa-gear"></i> Settings
            <i class="fa-solid fa-chevron-down settings-caret"></i>
          </button>
          <div class="settings-dropdown" id="adminSettings" [hidden]="!isSettingsOpen">
            <a routerLink="/admin-panel" routerLinkActive="active" (click)="closeMenu()">
              <i class="fa-solid fa-sliders"></i> Admin Panel
            </a>
            <a routerLink="/quiz/questions" routerLinkActive="active" (click)="closeMenu()">
              <i class="fa-regular fa-circle-question"></i> Question Manager
            </a>
            <a routerLink="/quiz/categories" routerLinkActive="active" (click)="closeMenu()">
              <i class="fa-solid fa-layer-group"></i> Categories
            </a>
          </div>
        </div>
      </div>
      <div class="hub-nav-actions">
        <button *ngIf="!loginEnabled || isLoggedIn" type="button" class="theme-toggle" (click)="toggleTheme()"
          [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
          <i class="fa-solid" [ngClass]="darkMode ? 'fa-sun' : 'fa-moon'"></i>
        </button>
        <a *ngIf="loginEnabled && !isLoggedIn" routerLink="/login" class="btn hub-signin" (click)="closeMenu()">Sign
          in</a>
        <button *ngIf="loginEnabled && isLoggedIn" type="button" class="btn hub-signin"
          (click)="logout(); closeMenu()">Sign out</button>
      </div>
    </div>
  </div>
</nav>
