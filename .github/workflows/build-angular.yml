# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Angular

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main","dev"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node JS
        uses: actions/setup-node@v4
        with:
           node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Configure production authentication API
        env:
          AUTH_API_URL: ${{ vars.AUTH_API_URL }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/environments/environment.prod.ts';
          const authApiUrl = process.env.AUTH_API_URL;
          if (!authApiUrl) {
            throw new Error('Set the AUTH_API_URL repository variable to the deployed HTTPS Node API URL before deploying GitHub Pages.');
          }
          const parsedUrl = new URL(authApiUrl);
          if (parsedUrl.protocol !== 'https:') {
            throw new Error('AUTH_API_URL must use HTTPS.');
          }
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes("authApiUrl: ''")) {
            throw new Error(`Could not find the authApiUrl placeholder in ${path}.`);
          }
          fs.writeFileSync(path, source.replace("authApiUrl: ''", `authApiUrl: ${JSON.stringify(authApiUrl.replace(/\/+$/, ''))}`));
          NODE
    
      - name: Build
        run: npm run build:prod -- --base-href=/Angular17JavaTotorial/
      
      - name: Create .nojekyll file
        run: touch dist/angular17-java-totorial/browser/.nojekyll
      
      - name: Copy 404.html to root for GitHub Pages
        run: cp src/assets/404.html dist/angular17-java-totorial/browser/404.html
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/angular17-java-totorial/browser'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4